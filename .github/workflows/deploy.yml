name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_NAME: ahmedrazadevops/nextjs-devops-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ steps.image.outputs.tag }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ steps.image.outputs.tag }}
          docker push $IMAGE_NAME:latest

      - name: Update Helm image tag
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ steps.image.outputs.tag }}\"/" nextjs-app/values.yaml

      - name: Commit updated Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nextjs-app/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm changes to commit"
          else
            git commit -m "Update image to ${{ steps.image.outputs.tag }}"
            git push
          fi